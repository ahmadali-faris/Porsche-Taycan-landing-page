<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Link css -->
   <link rel="stylesheet" href="style.css">
  <title>Porsche Taycan website</title>
</head>
<body>
  <!-- NAVBAR STARTS HERE -->
  <nav class="nav-bar">
    <img width="52" height="60" src="./assets/Logo.png" alt="Porsche logo">
    <ul class="nav-links">
      <li class="nav-link"><a href="#">HIGHLIGHTS</a></li>
      <li class="nav-link"><a href="#">DESIGN</a></li>
      <li class="nav-link"><a href="#">PERFORMANCE</a></li>
      <li class="nav-link"><a href="#">CHARGING</a></li>
      <li class="nav-link"><a href="#">CONFIGIRE</a></li>

    </ul>
    <button class="test-btn">TEST DRIVE</button>
  </nav>
  <!-- NAVBAR ENDS HERE -->

  <!-- MAIN STARTS HERE -->
   <main class="main">
    <h1 class="main-text">TAYCAN</h1>
    <div class="img-container">
      <img src="./assets/HeroCar.png" alt="car image">
    </div>
   </main>
   <!-- MAIN ENDS HERE -->

   <!-- FOOTER STARTS HERE -->
    <footer class="box">
      <div class="brand-div">
        <h4>PORSCHE</h4>
        <h3>TAYCAN Turbo S</h3>
      </div>
      <div class="text-div">
        <div class="stats">
          <h4>WLTP</h4>
          <h2>412km</h2>
        </div>
        <div class="stats">
          <h4>0-100KM/h</h4>
          <h2>2.8s</h2>
        </div>
        <div class="stats">
          <h4>HP</h4>
          <h2>560</h2>
        </div>
      </div>
      <div class="collection-div">
        <img width="100" src="./assets/Image car1.webp" alt="Car collection">
        <img width="100" src="./assets/Image car2.webp" alt="Car collection">
        <img width="100" src="./assets/Image car3.jpg" alt="Car collection">

      </div>
    </footer>
   <!-- FOOTER ENDS HERE -->


</body>
</html>
